name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy rdzenia OBD
        run: ./gradlew :obd-core:test --no-daemon --stacktrace

      # Bez sekretów aplikacja i tak się kompiluje (sprawdzenie kodu), ale nie jest publikowana –
      # APK podpisane przypadkowym kluczem nie instalowałoby się potem jako aktualizacja.
      - name: Przygotuj klucz podpisu
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::Brak sekretów SIGNING_KEYSTORE_BASE64 i SIGNING_PASSWORD – APK zostanie zbudowane, ale nie opublikowane."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/obd-skaner.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/obd-skaner.keystore" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zbuduj APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Nazwij plik
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk obd-skaner.apk

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: obd-skaner-apk
          path: obd-skaner.apk

      - name: Wystaw do pobrania (Releases)
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk obd-skaner.apk \
            --target "${{ github.sha }}" \
            --title "OBD Skaner na Androida (wersja 0.1.${{ github.run_number }})" \
            --notes "Plik APK do zainstalowania w telefonie z Androidem 8.0 lub nowszym. Wymaga adaptera ELM327 na klasyczny Bluetooth. Bezpośredni link: https://github.com/${{ github.repository }}/releases/latest/download/obd-skaner.apk" \
            --latest
